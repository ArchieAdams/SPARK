name: CI

on: [push, pull_request]

env:
  SPARK_SKIP_DOCKER_BUILD: 1

jobs:
  pam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f PAM/PAM.dockerfile -t spark-pam PAM
      - run: docker run --rm spark-pam

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest
        working-directory: App
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: App/app/build/outputs/apk/debug/app-debug.apk

  proverif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: Proofs
          file: Proofs/ProVerif.dockerfile
          tags: proverif:2.05
          load: true
          cache-from: type=gha,scope=proverif
          cache-to: type=gha,scope=proverif,mode=max
      - run: ./run-proverif-pair-v2.sh | tee proverif-pair-v2.log
        working-directory: Proofs
      - run: ./run-proverif-pair-v1.sh | tee proverif-pair-v1.log
        working-directory: Proofs
      - run: ./run-proverif-auth.sh | tee proverif-auth.log
        working-directory: Proofs
      - run: ./run-proverif-full.sh | tee proverif-full.log
        working-directory: Proofs
      - run: |
          grep '^RESULT' proverif-pair-v2.log | diff - expected/spark-pair-v2.results
          grep '^RESULT' proverif-pair-v1.log | diff - expected/spark-pair-v1.results
          grep '^RESULT' proverif-auth.log    | diff - expected/spark-auth.results
          grep '^RESULT' proverif-full.log    | diff - expected/spark.results
        working-directory: Proofs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proverif-logs
          path: Proofs/proverif-*.log

  easycrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: Proofs
          file: Proofs/Easycrypt.dockerfile
          tags: easycrypt:latest
          load: true
          cache-from: type=gha,scope=easycrypt
          cache-to: type=gha,scope=easycrypt,mode=max
      - run: chmod -R o+w Proofs
      - run: ./run-easycrypt.sh
        working-directory: Proofs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: easycrypt-log
          path: Proofs/output.log
